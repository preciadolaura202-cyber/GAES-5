<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SegurIA | Reportes</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-app.css">
</head>
<body class="app-layout">

  <!-- Barra lateral -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Menú principal">
    <div class="sidebar-header">
      <a href="dashboard.html" class="sidebar-brand">
        <div class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><circle cx="12" cy="11" r="3"/></svg></div>
        <div class="sidebar-brand-text"><span class="brand-name-lg">Segur<span class="ai-tag">IA</span></span><span class="brand-sub-sm">Red Ciudadana</span></div>
      </a>
      <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Cerrar menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
    </div>
    <nav class="sidebar-nav">
      <ul class="nav-list" role="list">
        <li><a href="dashboard.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Inicio</span></a></li>
        <li><a href="mapa.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg><span>Mapa</span></a></li>
        <li><a href="reportes.html" class="nav-item active" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg><span>Reportes</span></a></li>
        <li><a href="crear-reporte.html" class="nav-item nav-item-accent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg><span>Crear reporte</span></a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user"><div class="user-avatar">UC</div><div class="user-info"><span class="user-name">Usuario Ciudadano</span><span class="user-role">Modo Demostración</span></div></div>
      <a href="login.html" class="btn-logout" title="Cerrar sesión"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></a>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <div class="main-content" id="mainContent">
    <header class="page-header">
      <div class="page-header-left">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Abrir menú" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div>
          <h1 class="page-title">Lista de Reportes</h1>
          <p class="page-subtitle">Reportes comunitarios de demostración · <span class="demo-tag">datos ficticios</span></p>
        </div>
      </div>
      <div class="page-header-right">
        <a href="crear-reporte.html" class="btn-new-report">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>Nuevo reporte</span>
        </a>
      </div>
    </header>

    <!-- Barra de herramientas (búsqueda + filtros) -->
    <div class="list-toolbar">
      <!-- Búsqueda de texto -->
      <div class="search-wrap" role="search" style="max-width:320px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="search" class="search-input" id="reportSearch" placeholder="Buscar reporte…" aria-label="Buscar reporte por título o descripción">
      </div>

      <!-- Filtros por categoría -->
      <div class="cat-filter-row" id="reportCatFilters" role="group" aria-label="Filtrar por categoría">
        <button class="cat-filter-btn active" data-cat="all">Todas</button>
        <!-- JS agrega el resto -->
      </div>
    </div>

    <!-- Grid de tarjetas de reportes -->
    <div id="reportesGrid" class="reportes-grid" aria-live="polite" aria-label="Listado de reportes">
      <!-- JS genera las tarjetas -->
    </div>

    <!-- Estado vacío -->
    <div id="emptyState" class="empty-state" hidden>
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        <line x1="11" y1="8" x2="11" y2="14"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
      </svg>
      <h3>Sin resultados</h3>
      <p>No hay reportes que coincidan con tu búsqueda o filtro seleccionado.</p>
      <button class="btn-accent-sm" id="clearFiltersBtn">Limpiar filtros</button>
    </div>
  </div>

  <script src="data/demo-data.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/reportes.js"></script>
</body>
</html>
